name: Publish Foundry module and Discord bridge

on:
  push:
    branches: [main]
    paths:
      - "module.json"
      - "scripts/**"
      - "templates/**"
      - "styles/**"
      - "bridge/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foundry-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Discord bridge syntax
        run: |
          node --version
          node --check bridge/bridge.mjs
      - name: Build both release downloads
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, zipfile

          base = pathlib.Path(".")
          out = base / "dist"
          out.mkdir(exist_ok=True)
          manifest = json.loads((base / "module.json").read_text(encoding="utf-8"))
          version = "0.1." + os.environ["GITHUB_RUN_NUMBER"]
          repo = "https://github.com/Daikaze/talking-tokens-v14."
          manifest["version"] = version
          manifest["manifest"] = repo + "/releases/latest/download/module.json"
          manifest["download"] = repo + "/releases/download/v" + version + "/module.zip"
          payload = json.dumps(manifest, indent=2, ensure_ascii=False) + "\n"
          (out / "module.json").write_text(payload, encoding="utf-8")
          with zipfile.ZipFile(out / "module.zip", "w", compression=zipfile.ZIP_DEFLATED) as archive:
              archive.writestr("module.json", payload)
              for root in ("scripts", "styles", "templates"):
                  for f in sorted((base / root).rglob("*")):
                      if f.is_file():
                          archive.write(f, f.as_posix())

          # The helper is separate from the Foundry module and never contains .env secrets.
          include = ("bridge.mjs", "package.json", ".env.example", "start-windows.bat", "README.md")
          with zipfile.ZipFile(out / "discord-bridge.zip", "w", compression=zipfile.ZIP_DEFLATED) as archive:
              for filename in include:
                  f = base / "bridge" / filename
                  assert f.is_file(), f"Required file missing: {f}"
                  archive.write(f, filename)
          print("Packaged Talking Tokens V14", version, "and Windows bridge")
          PY
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python3 -c 'import json;print(json.load(open("dist/module.json"))["version"])')
          gh release create "v$VERSION" \
            dist/module.json dist/module.zip dist/discord-bridge.zip \
            --title "Talking Tokens v$VERSION (Beta)" \
            --notes "Foundry V14 module + local Windows Discord voice bridge beta. Install the module in Foundry using the manifest URL; download discord-bridge.zip separately for the GM's PC." \
            --latest
